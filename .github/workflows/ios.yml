# Builds an unsigned Gametap.ipa on a macOS runner. Download it from the run's artifacts and
# sign and install it from Windows with Sideloadly or AltStore, see "iOS without a Mac" in README.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # gradle-daemon-jvm.properties asks for JDK 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      # The project's pre-build script runs Gradle to build the Kotlin framework
      - name: Build app (unsigned)
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        working-directory: iosApp
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Gametap.app Payload/
          zip -qr Gametap.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Gametap-ipa
          path: iosApp/Gametap.ipa
          retention-days: 30
